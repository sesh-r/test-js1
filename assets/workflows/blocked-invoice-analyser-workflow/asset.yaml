apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: blocked-invoice-analyser-workflow
  description: Webhook-triggered workflow that retrieves blocked supplier invoice data from SAP S/4HANA (invoice, PO, goods receipt, vendor) and uses an AI agent to explain the block reason and recommend an action in plain language
  version: "1.0.0"
  type: n8nworkflow

projectVersion: "1"
sourceRoot: "."

workflow:
  definitionFile: blocked-invoice-analyser.n8n.json
  name: blocked-invoice-analyser-workflow
  ordId: sap.btpn8n:apiResource:ManagedN8nMcpServer:v1

provides:
  apis:
    - name: blocked_invoice_received
      path: /blocked-invoice-analyser-635d5/blocked-invoice-analyser-workflow/blocked-invoice-received
      kind: rest
      description: Triggers blocked invoice analysis — accepts a supplier invoice number and returns a plain-language explanation of the block reason and recommended action
      ordId: "sap.n8nwfrt:apiResource:blocked-invoice-analyser-635d5_blocked-invoice-analyser-workflow.blockedInvoiceReceived:v1"
    - name: blocked_invoice_received_mcp_server
      kind: mcp-server
      description: MCP server for blocked invoice received operations
      ordId: "sap.n8nwfrt:apiResource:blocked-invoice-analyser-635d5_blocked-invoice-analyser-workflow.blockedInvoiceReceivedMcpServer:v1"

requires:
  - name: sap-s4-supplier-invoice-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:blocked-invoice-analyser-635d5.sap-s4-supplier-invoice-mcp-server:v1
  - name: sap-s4-purchase-order-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:blocked-invoice-analyser-635d5.sap-s4-purchase-order-mcp-server:v1
  - name: sap-s4-goods-receipt-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:blocked-invoice-analyser-635d5.sap-s4-goods-receipt-mcp-server:v1
  - name: sap-s4-business-partner-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:blocked-invoice-analyser-635d5.sap-s4-business-partner-mcp-server:v1
  - name: blocked-invoice-analyser-agent
    kind: agent
    ordId: customer.build:agent:blocked-invoice-analyser-635d5.blocked-invoice-analyser-agent:v1
